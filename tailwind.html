<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom animation for the background pulse */
    @keyframes slow-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-slow { animation: slow-spin 20s linear infinite; }
  </style>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-8 overflow-hidden font-sans">

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/30 rounded-full blur-[120px] animate-slow"></div>
  <div class="absolute top-1/4 right-1/4 w-[300px] h-[300px] bg-fuchsia-500/20 rounded-full blur-[100px]"></div>

  <div class="relative z-10 max-w-4xl w-full grid md:grid-cols-2 gap-8">
    
    <div class="group relative overflow-hidden rounded-3xl bg-slate-800/50 p-1 transition-all hover:bg-gradient-to-br hover:from-indigo-500 hover:to-fuchsia-500">
      <div class="rounded-[calc(1.5rem-1px)] bg-slate-900 p-8 h-full">
        <div class="mb-4 overflow-hidden rounded-xl">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80" 
                 class="grayscale transition duration-500 group-hover:grayscale-0 group-hover:scale-110" alt="Abstract">
        </div>
        <h3 class="text-2xl font-bold text-white group-hover:text-indigo-300 transition">Group Hover States</h3>
        <p class="text-slate-400 mt-2 text-sm">Notice how hovering the card changes the image color, scales it, and glows the border—all via the <code class="text-pink-400">group-hover</code> utility.</p>
      </div>
    </div>

    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 p-8 rounded-3xl shadow-2xl">
      <h3 class="text-xl font-bold text-white mb-6">Peer Validation Engine</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
          <input type="email" placeholder="Enter an invalid email..." 
                 class="peer w-full bg-slate-800 border-none rounded-lg px-4 py-3 text-white ring-1 ring-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition" />
          
          <p class="mt-2 invisible peer-invalid:visible text-pink-500 text-xs italic">
            Please enter a valid email address.
          </p>
        </div>

        <div class="grid grid-cols-4 gap-2 pt-4">
          <div class="aspect-square bg-indigo-500 rounded-lg shadow-[0_0_20px_rgba(99,102,241,0.5)]"></div>
          <div class="aspect-square bg-slate-700 rounded-lg animate-pulse"></div>
          <div class="aspect-square bg-slate-700 rounded-lg"></div>
          <div class="aspect-square bg-slate-800 border border-slate-700 rounded-lg flex items-center justify-center text-slate-500 text-xl">+</div>
        </div>
      </div>
      
      <button class="w-full mt-8 py-3 rounded-lg font-bold text-white bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] transition-transform shadow-lg shadow-indigo-500/20">
        Update Settings
      </button>
    </div>

  </div>

  <div class="fixed bottom-10 right-10 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 text-white text-xs font-mono">
    v4.0 Ready // [top:unset]
  </div>

</body>
</html>
